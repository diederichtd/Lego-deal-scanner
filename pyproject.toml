[project]
name = "lego-deal-scanner"
version = "0.1.0"
description = "Monitor German marketplaces and surface potentially profitable LEGO deals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
bricklink = ["requests-oauthlib>=1.3"]
dev = ["pytest>=8"]

[project.scripts]
lego-deal-scanner = "lego_deal_scanner.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
